# XcodeGen part for the watchOS app (window 04-watchos). Included by the root project.yml.
# Paths are relative to this file (root includes parts with relativePaths: true). Signing,
# Swift version and strict concurrency come from the root project.yml (docs/xcodegen.md).
# Identifiers follow CONTRACT.md "Apple identifiers". The iOS app target (Apps/iOS) embeds
# this app by listing `- target: DroverWatch` in its dependencies.
targets:
  DroverWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    scheme: {}
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Drover
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Its own single-size watchOS AppIcon set (script/app-icons.py); never shared with the iOS app.
        CFBundleIconName: AppIcon
        # Only HTTPS and the OS's own crypto (exempt), so TestFlight never asks for export compliance per build.
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.drover.app
        DroverKeychainAccessGroup: $(AppIdentifierPrefix)dev.drover.shared
        CFBundleURLTypes:
          - CFBundleURLName: dev.drover.watch
            CFBundleURLSchemes: [drover]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: DroverWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.drover
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.drover.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.drover.app.watchkitapp
        PRODUCT_NAME: DroverWatch
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      # Watch complications (window 05-widgets) embed into the watch app.
      - target: DroverWidgets-watchOS
        embed: true
        codeSign: true
